name: Release (dev to main)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    name: Create release branch and PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set release branch name
        id: vars
        run: echo "branch=release/$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        run: git checkout -b "${{ steps.vars.outputs.branch }}"

      - name: Replace dev names with prod names
        run: python3 cicd-scripts/replace-env-reference.py

      - name: Validate no dev references remain
        run: python3 cicd-scripts/validate_env_reference.py

      - name: Commit changes
        id: commit
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: replace dev names with prod names [${{ steps.vars.outputs.branch }}]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push release branch
        if: steps.commit.outputs.changed == 'true'
        run: git push origin "${{ steps.vars.outputs.branch }}"

      - name: Open PR to main
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.vars.outputs.branch }}" \
            --title "Promote ${{ steps.vars.outputs.branch }} to main" \
            --body "Automated promotion from dev. Dev references replaced and validated."